name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Check Python syntax
        run: |
          if [ -d custom_components ]; then
            python -m compileall -q custom_components
          else
            echo "No custom_components directory yet; Python syntax check skipped."
          fi

      - name: Validate translations and panel script
        run: |
          python -m json.tool custom_components/steuertage/strings.json > /dev/null
          python -m json.tool custom_components/steuertage/translations/de.json > /dev/null
          python -m json.tool custom_components/steuertage/translations/en.json > /dev/null
          node --check custom_components/steuertage/www/steuertage_panel.js

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory yet; automated tests skipped."
          fi
